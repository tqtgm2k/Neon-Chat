<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⚡ Neon Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   NEON CHAT — CYBERPUNK DESIGN SYSTEM
═══════════════════════════════════════ */
:root {
  --bg:       #06080f;
  --bg2:      #0b0f1e;
  --bg3:      #111827;
  --panel:    rgba(8, 14, 35, 0.92);
  --border:   rgba(0, 245, 255, 0.18);
  --border2:  rgba(191, 0, 255, 0.2);
  --cyan:     #00f5ff;
  --pink:     #ff007f;
  --purple:   #bf00ff;
  --green:    #00ff88;
  --yellow:   #ffcc00;
  --text:     #c8d8ff;
  --text2:    #7888bb;
  --owner-c:  #ff00ff;
  --admin-c:  #00f5ff;
  --user-c:   #c8d8ff;
  --r:        8px;
  --glow-c:   0 0 12px #00f5ff88, 0 0 32px #00f5ff22;
  --glow-p:   0 0 12px #bf00ff88, 0 0 32px #bf00ff22;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  overflow: hidden;
  overflow-y: auto;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

/* ── Neon text ── */
.neon-cyan { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
.neon-pink { color: var(--pink); text-shadow: 0 0 8px var(--pink); }
.neon-purple { color: var(--purple); text-shadow: 0 0 8px var(--purple); }
.neon-green { color: var(--green); text-shadow: 0 0 8px var(--green); }

/* ────────────────────────────────────
   BACKGROUND GRID EFFECT
──────────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(0,245,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,245,255,.08) 0%, transparent 60%),
              radial-gradient(ellipse 60% 40% at 100% 100%, rgba(191,0,255,.06) 0%, transparent 60%);
  pointer-events: none;
}

/* ────────────────────────────────────
   SCREEN MANAGEMENT
──────────────────────────────────── */
.screen { display: none; position: relative; z-index: 1; }
.screen.active { display: flex; }

/* ────────────────────────────────────
   LOGIN / REGISTER SCREEN
──────────────────────────────────── */
#authScreen {
  min-height: 100vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-box {
  width: 100%;
  max-width: 400px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 32px;
  backdrop-filter: blur(24px);
  box-shadow: 0 0 40px rgba(0,245,255,.08), 0 24px 60px rgba(0,0,0,.6);
  animation: slideUp .5s cubic-bezier(.22,1,.36,1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

.auth-logo {
  text-align: center;
  margin-bottom: 32px;
}

.auth-logo .logo-title {
  font-family: 'Orbitron', monospace;
  font-size: 2.2rem;
  font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 20px var(--cyan), 0 0 40px rgba(0,245,255,.4);
  letter-spacing: 4px;
  display: block;
}

.auth-logo .logo-sub {
  font-size: 0.8rem;
  color: var(--text2);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 4px;
}

.auth-logo .logo-icon {
  font-size: 2.5rem;
  display: block;
  margin-bottom: 8px;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { filter: drop-shadow(0 0 8px var(--cyan)); }
  50% { filter: drop-shadow(0 0 20px var(--cyan)); }
}

/* Tab switcher */
.auth-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 28px;
  border-radius: var(--r);
  overflow: hidden;
  border: 1px solid var(--border);
}
.auth-tab {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: none;
  color: var(--text2);
  font-family: 'Rajdhani', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .25s;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.auth-tab.active {
  background: rgba(0,245,255,.12);
  color: var(--cyan);
  text-shadow: 0 0 8px var(--cyan);
}

/* Form elements */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 0.78rem;
  color: var(--text2);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 7px;
}
.form-input {
  width: 100%;
  background: rgba(0,0,0,.4);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 1rem;
  padding: 11px 14px;
  outline: none;
  transition: border .25s, box-shadow .25s;
}
.form-input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(0,245,255,.12);
}
.form-input::placeholder { color: var(--text2); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  border: none;
  border-radius: var(--r);
  font-family: 'Rajdhani', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all .2s;
  text-transform: uppercase;
}
.btn-primary {
  background: linear-gradient(135deg, rgba(0,245,255,.2), rgba(191,0,255,.2));
  border: 1px solid var(--cyan);
  color: var(--cyan);
  width: 100%;
  text-shadow: 0 0 8px var(--cyan);
  box-shadow: 0 0 20px rgba(0,245,255,.15);
  margin-top: 8px;
}
.btn-primary:hover { background: rgba(0,245,255,.25); box-shadow: 0 0 30px rgba(0,245,255,.3); }
.btn-primary:active { transform: scale(.98); }

.auth-error {
  background: rgba(255,0,127,.12);
  border: 1px solid rgba(255,0,127,.4);
  border-radius: var(--r);
  color: var(--pink);
  padding: 10px 14px;
  margin-top: 12px;
  font-size: 0.9rem;
  display: none;
}
.auth-error.show { display: block; }

/* ────────────────────────────────────
   MAIN CHAT SCREEN
──────────────────────────────────── */
#chatScreen {
  height: var(--app-height);
  flex-direction: column;
  overflow: hidden;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 56px;
  background: rgba(6, 10, 30, 0.95);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
  backdrop-filter: blur(10px);
}
.header-logo {
  font-family: 'Orbitron', monospace;
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 12px var(--cyan);
  letter-spacing: 3px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-logo .logo-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
  animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}
.header-spacer { flex: 1; }
.header-online {
  font-size: 0.82rem;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.online-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
}
.header-actions { display: flex; gap: 6px; }
.icon-btn {
  background: rgba(0,245,255,.08);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text2);
  padding: 6px 10px;
  cursor: pointer;
  font-size: 1rem;
  transition: all .2s;
  font-family: inherit;
}
.icon-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: var(--glow-c); }

/* Main layout */
.main-layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: rgba(8, 12, 28, 0.95);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform .3s;
}
.sidebar.collapsed { display: none; }

.sidebar-section {
  padding: 10px 12px 6px;
  font-size: 0.7rem;
  color: var(--text2);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid rgba(0,245,255,.06);
}
.sidebar-section .count {
  background: rgba(0,245,255,.15);
  color: var(--cyan);
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 0.7rem;
  min-width: 20px;
  text-align: center;
}

.user-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 4px;
}

.user-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .15s;
  position: relative;
}
.user-item:hover { background: rgba(0,245,255,.07); }

.user-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.85rem;
  flex-shrink: 0;
  position: relative;
  border: 2px solid transparent;
}
.user-avatar.owner { border-color: var(--owner-c); box-shadow: 0 0 8px rgba(255,0,255,.4); }
.user-avatar.admin { border-color: var(--admin-c); box-shadow: 0 0 8px rgba(0,245,255,.3); }

.status-dot {
  position: absolute;
  bottom: -1px; right: -1px;
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1.5px solid var(--bg2);
  background: var(--text2);
}
.status-dot.online { background: var(--green); box-shadow: 0 0 5px var(--green); }

.user-info-small { flex: 1; overflow: hidden; }
.user-name-small {
  font-size: 0.9rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-role-small {
  font-size: 0.7rem;
  color: var(--text2);
  letter-spacing: .5px;
}

/* ── Chat area ── */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}

.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* ── Messages ── */
.msg {
  display: flex;
  gap: 10px;
  padding: 4px 8px;
  border-radius: 8px;
  animation: fadeIn .2s ease;
  align-items: flex-start;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg:hover { background: rgba(255,255,255,.03); }
.msg:hover .msg-delete { opacity: 1; }

.msg-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.9rem;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg-body { flex: 1; min-width: 0; }
.msg-header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.msg-username {
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: opacity .2s;
}
.msg-username:hover { opacity: .75; }
.msg-badge {
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 700;
  letter-spacing: .5px;
}
.badge-owner { background: rgba(255,0,255,.15); color: var(--owner-c); border: 1px solid rgba(255,0,255,.3); }
.badge-admin { background: rgba(0,245,255,.12); color: var(--admin-c); border: 1px solid rgba(0,245,255,.25); }
.msg-time { font-size: 0.7rem; color: var(--text2); }
.msg-content {
  margin-top: 3px;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
  color: var(--text);
}
.msg-delete {
  opacity: 0;
  background: none;
  border: none;
  color: var(--pink);
  cursor: pointer;
  padding: 2px 6px;
  font-size: 0.85rem;
  transition: all .2s;
  flex-shrink: 0;
  align-self: center;
}
.msg-delete:hover { background: rgba(255,0,127,.15); border-radius: 4px; }

.msg-copy {
  opacity: 0;
  background: none;
  border: none;
  color: var(--cyan);
  cursor: pointer;
  padding: 2px 6px;
  font-size: 0.85rem;
  transition: all .2s;
  flex-shrink: 0;
  align-self: center;
}
.msg-copy:hover { background: rgba(0,245,255,.12); border-radius: 4px; }
.msg:hover .msg-copy { opacity: 1; }

/* System message */
.msg-system {
  text-align: center;
  color: var(--text2);
  font-size: 0.8rem;
  padding: 6px 0;
  letter-spacing: .5px;
}

/* ── Typing indicator ── */
.typing-bar {
  height: 22px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  font-size: 0.78rem;
  color: var(--text2);
  flex-shrink: 0;
}
.typing-dots span {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--cyan);
  margin: 0 1.5px;
  animation: typingDot 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes typingDot {
  0%, 80%, 100% { transform: scale(.6); opacity: .4; }
  40% { transform: scale(1); opacity: 1; }
}

/* ── Input area ── */
.input-area {
  padding: 10px 14px 14px;
  border-top: 1px solid var(--border);
  background: rgba(6, 10, 25, 0.95);
  flex-shrink: 0;
}
.input-wrap {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: rgba(0,0,0,.3);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 12px;
  transition: border .2s, box-shadow .2s;
}
.input-wrap:focus-within {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(0,245,255,.08);
}
#msgInput {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 1rem;
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.4;
}
#msgInput::placeholder { color: var(--text2); }
.send-btn {
  background: linear-gradient(135deg, rgba(0,245,255,.25), rgba(191,0,255,.15));
  border: 1px solid var(--cyan);
  color: var(--cyan);
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1.1rem;
  transition: all .2s;
  flex-shrink: 0;
  align-self: flex-end;
}
.send-btn:hover { background: rgba(0,245,255,.3); box-shadow: var(--glow-c); }

/* ────────────────────────────────────
   MODALS
──────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(6px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: modalFade .2s ease;
}
@keyframes modalFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.modal-overlay.show { display: flex; }

.modal {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 0 60px rgba(0,245,255,.1), 0 40px 80px rgba(0,0,0,.7);
  animation: modalSlide .3s cubic-bezier(.22,1,.36,1);
}
@keyframes modalSlide {
  from { transform: scale(.9) translateY(20px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  font-family: 'Orbitron', monospace;
  font-size: 1rem;
  color: var(--cyan);
  text-shadow: 0 0 8px var(--cyan);
  letter-spacing: 2px;
}
.modal-close {
  background: none;
  border: none;
  color: var(--text2);
  font-size: 1.3rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all .2s;
}
.modal-close:hover { color: var(--pink); background: rgba(255,0,127,.1); }
.modal-body { padding: 24px; }

/* ── Profile modal ── */
.avatar-img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.profile-avatar-big {
  width: 70px; height: 70px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  font-weight: 900;
  margin: 0 auto 20px;
  border: 3px solid var(--border);
}
.color-picker-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.color-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all .2s;
}
.color-dot:hover { transform: scale(1.2); }
.color-dot.selected { border-color: white; box-shadow: 0 0 10px currentColor; }

/* ── Admin panel ── */
.admin-user-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  background: rgba(0,0,0,.2);
  transition: border .2s;
}
.admin-user-card:hover { border-color: rgba(0,245,255,.3); }
.admin-user-top { display: flex; align-items: center; gap: 12px; }
.admin-user-info { flex: 1; min-width: 0; }
.admin-user-name {
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.admin-user-meta { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
.admin-actions { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--border); }

.btn-sm {
  padding: 6px 12px;
  font-size: 0.82rem;
  border-radius: 8px;
  border: 1px solid;
  cursor: pointer;
  background: none;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  transition: all .2s;
  white-space: nowrap;
  flex: 1;
  text-align: center;
}
.btn-sm.btn-ban { background: rgba(255,0,127,.1); color: var(--pink); border-color: rgba(255,0,127,.4); }
.btn-sm.btn-ban:hover { background: rgba(255,0,127,.25); }
.btn-sm.btn-unban { background: rgba(0,255,136,.1); color: #00ff88; border-color: rgba(0,255,136,.4); }
.btn-sm.btn-demote { background: rgba(136,170,255,.1); color: #88aaff; border-color: rgba(136,170,255,.4); }
.btn-sm.btn-admin { background: rgba(0,245,255,.1); color: var(--cyan); border-color: rgba(0,245,255,.4); }
.btn-sm.btn-delete { background: rgba(255,0,127,.1); color: var(--pink); border-color: rgba(255,0,127,.4); }
.btn-sm.btn-reset { background: rgba(255,170,0,.1); color: #ffaa00; border-color: rgba(255,170,0,.4); }
.btn-sm.btn-reset:hover { background: rgba(255,170,0,.25); }
.btn-ban  { color: var(--pink); border-color: rgba(255,0,127,.4); }
.btn-ban:hover { background: rgba(255,0,127,.15); }
.btn-unban { color: var(--green); border-color: rgba(0,255,136,.4); }
.btn-unban:hover { background: rgba(0,255,136,.15); }
.btn-admin { color: var(--cyan); border-color: rgba(0,245,255,.4); }
.btn-admin:hover { background: rgba(0,245,255,.15); }
.btn-demote { color: var(--yellow); border-color: rgba(255,204,0,.4); }
.btn-demote:hover { background: rgba(255,204,0,.15); }
.btn-delete { color: var(--pink); border-color: rgba(255,0,127,.4); }
.btn-delete:hover { background: rgba(255,0,127,.2); }
.btn-danger { background: rgba(255,0,127,.15); color: var(--pink); border: 1px solid rgba(255,0,127,.4); }
.btn-success { background: rgba(0,255,136,.1); color: var(--green); border: 1px solid rgba(0,255,136,.3); }

/* Banned badge */
.badge-banned { background: rgba(255,0,127,.15); color: var(--pink); border: 1px solid rgba(255,0,127,.3); font-size: 0.65rem; padding: 1px 5px; border-radius: 4px; }

/* ── Toast notifications ── */
.toast-container {
  position: fixed;
  top: 70px;
  right: 16px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 0.88rem;
  font-weight: 600;
  backdrop-filter: blur(12px);
  animation: toastIn .3s cubic-bezier(.22,1,.36,1);
  max-width: 300px;
  border: 1px solid;
  pointer-events: auto;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(30px); }
  to   { opacity: 1; transform: translateX(0); }
}
.toast.success { background: rgba(0,255,136,.1); border-color: rgba(0,255,136,.4); color: var(--green); }
.toast.error   { background: rgba(255,0,127,.1); border-color: rgba(255,0,127,.4); color: var(--pink); }
.toast.info    { background: rgba(0,245,255,.1); border-color: rgba(0,245,255,.4); color: var(--cyan); }
@keyframes toastOut {
  to { opacity: 0; transform: translateX(30px); }
}

/* ── Spinner ── */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(0,245,255,.2);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Divider ── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0;
}

/* ── Role colors ── */
.role-owner { color: var(--owner-c) !important; }
.role-admin { color: var(--admin-c) !important; }
.role-user  { color: var(--user-c); }

/* ── User profile popup ── */
#userPopup {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  width: 220px;
  z-index: 200;
  box-shadow: 0 0 30px rgba(0,245,255,.1), 0 20px 50px rgba(0,0,0,.6);
  display: none;
  backdrop-filter: blur(16px);
}
#userPopup.show { display: block; animation: fadeIn .15s ease; }
.popup-avatar {
  width: 50px; height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  font-weight: 900;
  margin: 0 auto 10px;
}
.popup-name { text-align: center; font-weight: 700; font-size: 1rem; }
.popup-role { text-align: center; font-size: 0.78rem; color: var(--text2); margin-top: 2px; }
.popup-bio { font-size: 0.8rem; color: var(--text2); text-align: center; margin-top: 8px; min-height: 16px; }

/* ── Mobile toggle ── */
.sidebar-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text2);
  font-size: 1.3rem;
  cursor: pointer;
  padding: 6px 8px;
}

/* ── Responsive ── */
@media (max-width: 600px) {
  .sidebar { 
    position: absolute;
    left: 0; top: 56px; bottom: 0;
    z-index: 20;
    width: 200px;
    transform: translateX(-100%);
    transition: transform .3s;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggle { display: flex; }
  .header-online { display: none; }
  .auth-box { padding: 28px 20px; }
}

/* Scrollbar for modal */
.modal::-webkit-scrollbar { width: 4px; }
.modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Color input ── */
input[type="color"] {
  width: 36px; height: 36px;
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 2px;
  background: none;
  cursor: pointer;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border-radius: 5px; border: none; }

/* ── Tab bar ── */
.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.tab-btn {
  flex: 1;
  padding: 10px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text2);
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 1px;

}
.tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── Empty states ── */
.empty-state {
  text-align: center;
  color: var(--text2);
  padding: 30px 20px;

}
.empty-state .icon { font-size: 2rem; display: block; margin-bottom: 10px; }

/* ── Textarea ── */
textarea.form-input {

/* ── Select ── */
select.form-input {

<script>
// ════════════════════════════════════════════
//   NEON CHAT — CLIENT v1.0
// ════════════════════════════════════════════

let socket = null;
let token = null;
let me = null;
let allUsers = [];
let onlineIds = [];
let typingTimer = null;

const COLORS = ['#ff6b35','#00ff88','#ff007f','#00f5ff','#bf00ff','#ffcc00','#ff88cc','#44ffcc','#ff4444','#4488ff'];

// ── Storage ──────────────────────────────────
function saveSession(tok, user) {
  try { localStorage.setItem('nc_token', tok); localStorage.setItem('nc_user', JSON.stringify(user)); } catch{}
}
function clearSession() {
  try { localStorage.removeItem('nc_token'); localStorage.removeItem('nc_user'); } catch{}
}
function loadSession() {
  try {
    const t = localStorage.getItem('nc_token');
    const u = localStorage.getItem('nc_user');
    if (t && u) return { token: t, user: JSON.parse(u) };
  } catch{}
  return null;
}

// ── Toast ─────────────────────────────────────
function toast(msg, type = 'info', dur = 3000) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut .3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }, dur);
}

// ── Utilities ─────────────────────────────────
function initials(name) {
  return name ? name[0].toUpperCase() : '?';
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
}
function roleName(role) {
  return { owner: '👑 Owner', admin: '🛡️ Admin', user: '👤 User' }[role] || role;
}
function roleClass(role) {
  return { owner: 'role-owner', admin: 'role-admin', user: 'role-user' }[role] || '';
}
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function linkify(text) {
  const esc = escHtml(text);
  return esc.replace(/(https?:\/\/[^\s<>"]+)/gi, '<a href="$1" target="_blank" rel="noopener" style="color:var(--cyan)">$1</a>');
}
function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function scrollToBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}
function isNearBottom() {
  const el = document.getElementById('messages');
  return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
}

// ── Auth tabs ─────────────────────────────────
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', i === (isLogin ? 0 : 1));
  });
}

// ── Login ────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');

  errEl.classList.remove('show');
  if (!email || !password) { showErr(errEl, 'Vui lòng nhập đầy đủ thông tin'); return; }

  btn.innerHTML = '<span class="spinner"></span> Đang đăng nhập...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { showErr(errEl, data.error || 'Lỗi đăng nhập'); return; }
    loginSuccess(data.token, data.user);
  } catch (e) {
    showErr(errEl, 'Không thể kết nối server');
  } finally {
    btn.innerHTML = '⚡ Đăng nhập';
    btn.disabled = false;
  }
}

async function doRegister() {
  const email = document.getElementById('regEmail').value.trim();
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const pass2 = document.getElementById('regPass2').value;
  const errEl = document.getElementById('regErr');
  const btn = document.getElementById('regBtn');

  errEl.classList.remove('show');
  if (!email || !username || !password) { showErr(errEl, 'Vui lòng nhập đầy đủ thông tin'); return; }
  if (password !== pass2) { showErr(errEl, 'Mật khẩu không khớp'); return; }

  btn.innerHTML = '<span class="spinner"></span> Đang tạo...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, username, password })
    });
    const data = await res.json();
    if (!res.ok) { showErr(errEl, data.error || 'Lỗi tạo tài khoản'); return; }
    loginSuccess(data.token, data.user);
    toast('Tài khoản đã được tạo!', 'success');
  } catch (e) {
    showErr(errEl, 'Không thể kết nối server');
  } finally {
    btn.innerHTML = '🚀 Tạo tài khoản';
    btn.disabled = false;
  }
}

function showErr(el, msg) {
  el.textContent = msg;
  el.classList.add('show');
}

function loginSuccess(tok, user) {
  token = tok;
  me = user;
  saveSession(tok, user);
  showChat();
  initSocket();
  loadMessages();
  if (['admin','owner'].includes(user.role)) {
    document.getElementById('adminBtn').style.display = '';
  }
}

function doLogout() {
  if (socket) socket.disconnect();

  token = null; me = null; allUsers = []; onlineIds = [];
  document.getElementById('messages').innerHTML = '<div class="msg-system">⚡ Chào mừng đến Neon Chat!</div>';
  document.getElementById('userList').innerHTML = '';

// ── Socket.io ─────────────────────────────────
function initSocket() {
  if (socket) socket.disconnect();
  socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect', () => {
    socket.emit('authenticate', { token });
  });

  socket.on('authenticated', () => {});

  socket.on('auth_failed', () => {
    toast('Phiên đăng nhập hết hạn', 'error');
    doLogout();
  });

  socket.on('force_logout', ({ reason }) => {
    toast(reason || 'Bị đăng xuất', 'error');
    doLogout();
  });

  socket.on('new_message', (msg) => {
    const atBottom = isNearBottom();
    // Xóa tin nhắn temp nếu là của mình
    if (msg.userId === me?.id) {
      const temps = document.querySelectorAll('[id^="msg-temp-"]');
      temps.forEach(t => t.remove());
    }
    appendMessage(msg);
    if (atBottom) scrollToBottom();
  });

  socket.on('message_deleted', ({ messageId }) => {
    const el = document.getElementById('msg-' + messageId);
    if (el) el.remove();
  });

  socket.on('online_update', (ids) => {
    onlineIds = ids;
    document.getElementById('onlineCount').textContent = ids.length + ' online';
    renderUserList();
  });

  socket.on('users_update', (users) => {
    allUsers = users;
    document.getElementById('userCount').textContent = users.length;
    renderUserList();
    // Update my info
    const myUser = users.find(u => u.id === me.id);
    if (myUser) me = { ...me, ...myUser };
    // Cập nhật admin panel nếu đang mở
    const adminModal = document.getElementById('adminModal');
    if (adminModal && adminModal.classList.contains('show')) {
      renderAdminUsers();
    }
  });

  socket.on('user_typing', ({ username, color }) => {
    if (username === me.username) return;
    const bar = document.getElementById('typingBar');
    bar.innerHTML = `<span style="color:${escHtml(color)};font-weight:700">${escHtml(username)}</span>&nbsp;đang nhập&nbsp;<span class="typing-dots"><span></span><span></span><span></span></span>`;
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { bar.innerHTML = ''; }, 2500);
  });

  socket.on('disconnect', () => {
    document.getElementById('onlineCount').textContent = '0 online';
  });

  socket.on('reconnect', () => {
    socket.emit('authenticate', { token });
  });
}

// ── Messages ──────────────────────────────────
async function loadMessages() {
  try {
    const res = await fetch('/api/messages', { headers: { 'x-token': token } });
    if (!res.ok) return;
    const msgs = await res.json();
    const container = document.getElementById('messages');
    container.innerHTML = '<div class="msg-system">⚡ Chào mừng đến Neon Chat!</div>';
    msgs.forEach(m => appendMessage(m, false));
    scrollToBottom();
  } catch (e) {}
}

function appendMessage(msg, animate = true) {
  const container = document.getElementById('messages');
  const canDelete = me && ['admin', 'owner'].includes(me.role);
  const color = msg.color || '#c8d8ff';
  const badgeClass = { owner: 'badge-owner', admin: 'badge-admin' }[msg.role] || '';
  const badgeLabel = msg.badge || (msg.role === 'owner' ? '⚡ OWNER' : msg.role === 'admin' ? '🛡️ ADMIN' : '');

  const div = document.createElement('div');
  div.className = 'msg' + (animate ? '' : '');
  div.id = 'msg-' + msg.id;
  div.style.animation = animate ? 'fadeIn .2s ease' : 'none';

  div.innerHTML = `
    <div class="msg-avatar" style="background:${escHtml(color)}22;color:${escHtml(color)};border:2px solid ${escHtml(color)}44;overflow:hidden;">
      ${msg.avatar ? `<img src="${msg.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : escHtml(initials(msg.username))}
    </div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-username ${roleClass(msg.role)}" style="color:${escHtml(color)}"
              onclick="showUserPopup(event,'${escHtml(msg.userId)}')">${escHtml(msg.username)}</span>
        ${badgeLabel ? `<span class="msg-badge ${badgeClass}">${escHtml(badgeLabel)}</span>` : ''}
        <span class="msg-time">${fmtTime(msg.timestamp)}</span>
      </div>
      <div class="msg-content">${msg.type === 'image' ? `<img class="msg-image" src="${msg.imageData}" onclick="openImage(this.src)">` : linkify(msg.content)}</div>
    </div>
    <button class="msg-copy" onclick="copyMessage(this)" title="Sao chép">📋</button>
    ${canDelete ? `<button class="msg-delete" onclick="deleteMessage('${escHtml(msg.id)}')" title="Xóa">🗑</button>` : ''}
  `;

  container.appendChild(div);

  // Remove old messages if too many
  const msgs = container.querySelectorAll('.msg');
  if (msgs.length > 150) msgs[0].remove();
}

let _pendingImageData = null;

function previewImage(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    toast('Ảnh tối đa 10MB!', 'error', 2000);
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // Nén ảnh
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const MAX = 1280;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.75);

      // Lưu ảnh đã nén và hiện preview
      _pendingImageData = compressed;
      document.getElementById('imagePreviewThumb').src = compressed;
      document.getElementById('imagePreviewBar').style.display = 'flex';
      document.getElementById('msgInput').placeholder = 'Thêm chú thích... (tuỳ chọn)';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function cancelImagePreview() {
  _pendingImageData = null;
  document.getElementById('imagePreviewBar').style.display = 'none';
  document.getElementById('imagePreviewThumb').src = '';
  document.getElementById('msgInput').placeholder = 'Nhắn tin...';
}

function confirmSendImage() {
  if (!_pendingImageData || !socket) return;
  const caption = document.getElementById('msgInput').value.trim();
  socket.emit('send_message', { token, type: 'image', imageData: _pendingImageData, content: caption });
  cancelImagePreview();
  document.getElementById('msgInput').value = '';
  document.getElementById('msgInput').style.height = 'auto';
}

async function copyMessage(btn) {
  const msgEl = btn.closest('.msg');
  const text = msgEl?.querySelector('.msg-content')?.textContent || '';
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const orig = btn.textContent;
  btn.textContent = '✅';
  toast('Đã sao chép!', 'success', 1500);
  setTimeout(() => { btn.textContent = orig; }, 1500);
}

// ── User list ─────────────────────────────────
function renderUserList() {
  const container = document.getElementById('userList');
  const sorted = [...allUsers].sort((a, b) => {
    const rOrder = { owner: 0, admin: 1, user: 2 };
    const aOn = onlineIds.includes(a.id);
    const bOn = onlineIds.includes(b.id);
    if (aOn !== bOn) return aOn ? -1 : 1;
    return (rOrder[a.role] ?? 2) - (rOrder[b.role] ?? 2);
  });

  container.innerHTML = sorted.map(u => {
    const online = onlineIds.includes(u.id);
    const color = u.color || '#c8d8ff';
    return `
      <div class="user-item" onclick="showUserPopupById(event,'${escHtml(u.id)}')">
        <div class="user-avatar ${u.role}" style="background:${escHtml(color)}22;color:${escHtml(color)};overflow:hidden;position:relative;">
          ${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : escHtml(initials(u.username))}
          <div class="status-dot ${online ? 'online' : ''}"></div>
        </div>
        <div class="user-info-small">
          <div class="user-name-small ${roleClass(u.role)}" style="color:${escHtml(color)}">${escHtml(u.username)}</div>
          <div class="user-role-small">${roleName(u.role)}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function uploadAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('Ảnh tối đa 5MB!', 'error'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    // Nén ảnh
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      const SIZE = 200;
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      // Crop vuông giữa
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2;
      const sy = (img.height - min) / 2;
      ctx.drawImage(img, sx, sy, min, min, 0, 0, SIZE, SIZE);
      const compressed = canvas.toDataURL('image/jpeg', 0.8);
      try {
        const res = await fetch('/api/avatar', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-token': token },
          body: JSON.stringify({ avatar: compressed })
        });
        const data = await res.json();
        if (!res.ok) { toast(data.error || 'Lỗi upload', 'error'); return; }
        me = { ...me, ...data.user };
        saveSession(token, me);
        toast('Đã cập nhật avatar!', 'success');
        openProfile(); // Refresh modal
      } catch { toast('Lỗi kết nối', 'error'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function renderAdminUsers() {
  const list = document.getElementById('adminUserList');
  const myRole = me?.role;
  const searchEl = document.getElementById('adminSearch');
  const keyword = searchEl ? searchEl.value.toLowerCase().trim() : '';
  const renderUsers = [...allUsers]
    .filter(u => !keyword || u.username.toLowerCase().includes(keyword) || (u.email||'').toLowerCase().includes(keyword))
    .sort((a, b) => {
      const rOrder = { owner: 0, admin: 1, user: 2 };
      return (rOrder[a.role] ?? 2) - (rOrder[b.role] ?? 2);
    });

  if (!renderUsers.length) {
    list.innerHTML = '<div class="empty-state"><span class="icon">👥</span>Không có người dùng</div>';
    return;
  }

  list.innerHTML = renderUsers.map(u => {
    const color = u.color || '#c8d8ff';
    const isSelf = u.id === me.id;
    const isOwner = u.role === 'owner';
    const isAdmin = u.role === 'admin';
    const canModify = !isSelf && !isOwner && !(myRole === 'admin' && isAdmin);

    let actions = '';
    if (canModify) {
      if (u.banned) {
        actions += `<button class="btn-sm btn-unban" onclick="updateUser('${u.id}', {banned:false})">✅ Unban</button>`;
      } else {
        actions += `<button class="btn-sm btn-ban" onclick="updateUser('${u.id}', {banned:true})">🚫 Ban</button>`;
      }
      if (myRole === 'owner') {
        if (isAdmin) {
          actions += `<button class="btn-sm btn-demote" onclick="updateUser('${u.id}', {role:'user'})">⬇️ Demote</button>`;
        } else {
          actions += `<button class="btn-sm btn-admin" onclick="updateUser('${u.id}', {role:'admin'})">⬆️ Admin</button>`;
        }
        actions += `<button class="btn-sm btn-delete" onclick="deleteUser('${u.id}','${escHtml(u.username)}')">🗑 Xóa</button>`;
        actions += `<button class="btn-sm btn-reset" onclick="resetPassword('${u.id}','${escHtml(u.username)}')">🔑 Reset MK</button>`;
      }
    }

    return `
      <div class="admin-user-card">
        <div class="admin-user-top">
          <div style="width:40px;height:40px;flex-shrink:0;background:${escHtml(color)}22;color:${escHtml(color)};border:2px solid ${escHtml(color)}44;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;overflow:hidden;">
            ${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : escHtml(initials(u.username))}
          </div>
          <div class="admin-user-info">
            <div class="admin-user-name">
              <span class="${roleClass(u.role)}" style="color:${escHtml(color)}">${escHtml(u.username)}</span>
              ${u.banned ? '<span class="badge-banned">BANNED</span>' : ''}
              ${isSelf ? '<span style="font-size:0.7rem;color:var(--text2)">(Bạn)</span>' : ''}
            </div>
            <div class="admin-user-meta">${roleName(u.role)} • ${onlineIds.includes(u.id) ? '🟢 Online' : '⚫ Offline'}${u.email ? ` • ${escHtml(u.email)}` : ''}</div>
          </div>
        </div>
        ${actions ? `<div class="admin-actions">${actions}</div>` : ''}
      </div>
    `;
  }).join('');
}

async function updateUser(userId, updates) {
  try {
    const res = await fetch('/api/users/' + userId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-token': token },
      body: JSON.stringify(updates)
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || 'Lỗi cập nhật', 'error'); return; }
    toast('Đã cập nhật!', 'success');
    renderAdminUsers();
  } catch { toast('Lỗi kết nối', 'error'); }
}

async function resetPassword(userId, username) {
  const newPass = prompt(`Nhập mật khẩu mới cho "${username}":`);
  if (!newPass) return;
  if (newPass.length < 4) { toast('Mật khẩu tối thiểu 4 ký tự!', 'error'); return; }
  try {
    const res = await fetch(`/api/users/${userId}/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token': token },
      body: JSON.stringify({ newPassword: newPass })
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || 'Lỗi reset', 'error'); return; }
    toast(`Đã reset mật khẩu cho "${username}"!`, 'success');
  } catch { toast('Lỗi kết nối', 'error'); }
}

async function deleteUser(userId, username) {
  if (!confirm(`Xóa tài khoản "${username}"?\nHành động này không thể hoàn tác!`)) return;
  try {
    const res = await fetch('/api/users/' + userId, {
      method: 'DELETE',
      headers: { 'x-token': token }
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || 'Lỗi xóa', 'error'); return; }
    toast(`Đã xóa "${username}"`, 'success');
    renderAdminUsers();
  } catch { toast('Lỗi kết nối', 'error'); }
}

// ── Enter key in login ─────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  ['loginUser','loginPass'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  });
  ['regUser','regPass','regPass2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
  });
});

function setMobileHeight() {
    document.documentElement.style.setProperty(
        '--app-height',
        `${window.innerHeight}px`
    );
}

window.addEventListener('resize', setMobileHeight);
setMobileHeight();
